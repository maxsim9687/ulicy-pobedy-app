name: UlicyPobedy
options:
  bundleIdPrefix: space.maxsim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  UlicyPobedy:
    type: application
    platform: iOS
    sources:
      - path: UlicyPobedy
      - path: ../shared
        type: folder
        buildPhase: resources
    info:
      path: UlicyPobedy/Info.plist
      properties:
        CFBundleDisplayName: "Улицы Победы"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: "Камера нужна, чтобы повесить AR-табличку на стену."
        NSLocationWhenInUseUsageDescription: "Геолокация нужна, чтобы найти AR-таблички и точки квеста."
        NSPhotoLibraryAddUsageDescription: "Чтобы сохранить AR-фото с табличкой в галерею."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.maxsim.ulicy
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
